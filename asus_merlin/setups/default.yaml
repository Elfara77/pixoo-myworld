# Default Pixoo Merlin layout — 3 animated screens
setup:
  title: Asus Merlin
  screen_seconds: 8.0

screens:
  - id: overview
    enabled: true
    widgets:
      - title
      - clients
      - ram
      - cpu
      - temp

  - id: bandwidth
    enabled: true
    widgets:
      - wan_graph

  - id: status
    enabled: true
    widgets:
      - title
      - internet
      - wan_ip
      - usb
      - ethernet
