# Default Pixoo Merlin layout — 6 animated screens
#
# Timing priority:
#   1) screens[].seconds   (optional, this screen only)
#   2) setup.screen_seconds (optional, all screens in this setup)
#   3) SCREEN_SECONDS in config.env (global default)
setup:
  title: Asus Merlin
  screen_seconds: 8.0

screens:
  - id: overview
    enabled: true
    widgets:
      - title
      - clients
      - ram
      - cpu
      - temp

  - id: bandwidth
    enabled: true
    seconds: 12
    widgets:
      - wan_graph

  - id: status
    enabled: true
    seconds: 10
    widgets:
      - title
      - internet
      - wan_ip
      - usb
      - ethernet

  - id: top_dl
    enabled: true
    widgets:
      - title
      - top_clients

  - id: hour_stats
    enabled: true
    widgets:
      - hour_stats

  - id: disk
    enabled: true
    widgets:
      - disk_pie
